{% extends "base.html" %}
{% block title %}My account · Impact Circles{% endblock %}
{% block body %}
<div class="intro"><p class="eyebrow">My account</p><h1>Change your password</h1><p>{{ user.email }}</p></div>
<section class="card narrow"><h2>Password</h2>
  {% if error %}<div class="alert">{{ error }}</div>{% endif %}{% if success %}<div class="success">{{ success }}</div>{% endif %}
  <form class="stack" method="post" action="/account/password"><input type="hidden" name="csrf" value="{{ user.csrf_token }}">
    <label>Current password <input type="password" name="current_password" autocomplete="current-password" required></label>
    <label>New password <input type="password" name="new_password" autocomplete="new-password" minlength="12" required></label>
    <button class="primary">Update password</button>
  </form>
</section>
{% endblock %}
