[project]
name = "impact-tools"
version = "0.1.0"
description = "Impact Circles team tools for financial document workflows and project-aware content generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
